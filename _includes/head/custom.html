{% include base_path %}

{% if page.custom_favicon %}

  <link rel="shortcut icon" href="{{ page.custom_favicon | relative_url }}">
  <link rel="apple-touch-icon" href="{{ page.custom_favicon | relative_url }}">

{% else %}

  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=M44lzPylqQ">
  <link rel="icon" type="image/png" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=M44lzPylqQ" sizes="32x32">
  <link rel="icon" type="image/png" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=M44lzPylqQ" sizes="16x16">
  <link rel="manifest" href="{{ base_path }}/images/manifest.json?v=M44lzPylqQ">
  <link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=M44lzPylqQ" color="#000000">
  <link rel="shortcut icon" href="/images/favicon.ico?v=M44lzPylqQ">
  <meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=M44lzPylqQ">
  
{% endif %}

<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
